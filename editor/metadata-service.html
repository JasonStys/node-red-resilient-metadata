<!--
  File: Shared metadata service editor definition.
  Purpose: Configure safe connection limits and a protected API-token credential.
  Key fields: baseUrl, timeoutMs, maxResponseBytes, retry policy, concurrency, queue, apiToken.
-->
<script type="text/javascript">
  (function () {
    'use strict';

    RED.nodes.registerType('metadata-service', {
      category: 'config',
      defaults: {
        name: { value: '' },
        baseUrl: { value: 'http://127.0.0.1:4010', required: true },
        timeoutMs: { value: 3000, required: true, validate: RED.validators.number() },
        maxResponseBytes: { value: 262144, required: true, validate: RED.validators.number() },
        retryCount: { value: 1, required: true, validate: RED.validators.number() },
        retryDelayMs: { value: 100, required: true, validate: RED.validators.number() },
        maxConcurrent: { value: 4, required: true, validate: RED.validators.number() },
        maxQueueDepth: { value: 32, required: true, validate: RED.validators.number() },
      },
      credentials: {
        apiToken: { type: 'password' },
      },
      label: function () {
        return this.name || this.baseUrl || 'metadata service';
      },
    });
  })();
</script>

<script type="text/html" data-template-name="metadata-service">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name" placeholder="Metadata service" />
  </div>
  <div class="form-row">
    <label for="node-config-input-baseUrl"><i class="fa fa-link"></i> Base URL</label>
    <input type="url" id="node-config-input-baseUrl" placeholder="https://metadata.example" />
  </div>
  <div class="form-row">
    <label for="node-config-input-apiToken"><i class="fa fa-key"></i> API token</label>
    <input type="password" id="node-config-input-apiToken" autocomplete="new-password" />
  </div>
  <div class="form-row">
    <label for="node-config-input-timeoutMs"><i class="fa fa-clock-o"></i> Timeout (ms)</label>
    <input type="number" id="node-config-input-timeoutMs" min="100" max="60000" step="100" />
  </div>
  <div class="form-row">
    <label for="node-config-input-maxResponseBytes"><i class="fa fa-database"></i> Max bytes</label>
    <input type="number" id="node-config-input-maxResponseBytes" min="1024" max="1048576" />
  </div>
  <div class="form-row">
    <label for="node-config-input-retryCount"><i class="fa fa-repeat"></i> Retries</label>
    <input type="number" id="node-config-input-retryCount" min="0" max="2" />
  </div>
  <div class="form-row">
    <label for="node-config-input-retryDelayMs"><i class="fa fa-pause"></i> Retry delay</label>
    <input type="number" id="node-config-input-retryDelayMs" min="0" max="5000" step="50" />
  </div>
  <div class="form-row">
    <label for="node-config-input-maxConcurrent"><i class="fa fa-tasks"></i> Concurrency</label>
    <input type="number" id="node-config-input-maxConcurrent" min="1" max="32" />
  </div>
  <div class="form-row">
    <label for="node-config-input-maxQueueDepth"><i class="fa fa-bars"></i> Queue depth</label>
    <input type="number" id="node-config-input-maxQueueDepth" min="0" max="1000" />
  </div>
  <div class="form-tips">
    Use HTTPS outside loopback development. The token is stored by Node-RED's credentials system and
    is not included in exported flows.
  </div>
</script>

<script type="text/markdown" data-help-name="metadata-service">
  Shared connection and workload policy for Resilient Metadata nodes.

  ### Configuration

  - **Base URL** must use HTTPS, except `localhost`, `127.0.0.1`, or `[::1]` during development.
  - **API token** is optional and stored separately by Node-RED's credential system.
  - **Timeout** applies to each HTTP attempt.
  - **Max bytes** bounds response memory before JSON parsing.
  - **Retries** may be 0–2 and apply only to safe GET failures such as timeouts, rate limits, or server errors.
  - **Concurrency** and **queue depth** place a hard limit on shared in-flight and waiting work.
</script>
