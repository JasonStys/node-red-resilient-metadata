# File: Build and actually use the complete unsigned Windows Node-RED workbench in a relocated synthetic profile.
name: Native application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_package:
        description: Retain the tested unsigned ZIP for one day on trusted main only
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Actual relocated Windows Node-RED workbench
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.10'
      - name: Prepare and independently verify exact upstream installer component
        run: python scripts/prepare-npm-component.py --download
      - name: Create the verified deterministic installer TAR without network
        run: python scripts/prepare-npm-component.py --package
      - name: Exercise actual cold CLI modes and preparation boundaries
        run: python -m unittest discover -s native-installer/tests -p "test_prepare*.py" -v
      - name: Enable the pinned original package manager
        run: corepack enable
      - name: Install the exact original locked development graph
        run: pnpm install --frozen-lockfile
      - name: Install the exact isolated desktop build graph
        run: npm --prefix desktop ci --ignore-scripts
      - name: Install the exact isolated shipped runtime graph
        run: npm --prefix native-runtime ci --ignore-scripts --install-links
      - name: Install exact locked Electron runtime
        run: node desktop/node_modules/electron/install.js
      - name: Verify physical development core and nested dependency identities
        run: node scripts/verify-physical-runtime.mjs development
      - name: Verify physical shipped core and nested dependency identities
        run: node scripts/verify-physical-runtime.mjs native
      - name: Audit the complete private runtime graph
        run: npm --prefix native-runtime audit --audit-level=moderate
      - name: Audit the complete desktop build graph
        run: npm --prefix desktop audit --audit-level=moderate
      - name: Audit the complete original development graph
        run: pnpm audit --audit-level=moderate
      - name: Prove shipped patched npm CLI offline behavior
        run: python native-installer/tests/offline_cli.py --node desktop/node_modules/electron/dist/electron.exe --component native --output artifacts/native-tooling/npm-cli-hosted-native
      - name: Prove development patched npm CLI offline behavior
        run: python native-installer/tests/offline_cli.py --node desktop/node_modules/electron/dist/electron.exe --component development --output artifacts/native-tooling/npm-cli-hosted-development
      - name: Build original compiled registrations
        run: pnpm build
      - name: Verify actual Node-RED engine and retained ownership
        run: pnpm native:test
      - name: Verify actual archive controls
        run: python -m unittest discover -s tests -p test_native_archive.py -v
      - name: Build exact clean native application
        run: node scripts/build-native.mjs release/hosted
      - name: Relocate every actual payload and use the real app twice
        run: python scripts/archive_native.py release/hosted/win-unpacked .runtime/native-hosted
      - name: Retain bounded receipts and actual screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metadata-native-proof
          path: |
            .runtime/native-hosted/proof.json
            .runtime/native-hosted/archive.json
            .runtime/native-hosted/failure.json
            .runtime/native-hosted/*.png
            artifacts/native-tooling/npm-cli-hosted-*/proof.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain complete unsigned ZIP only by explicit trusted-main request
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.upload_package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metadata-native-package
          path: |
            release/hosted/NodeRedMetadata-1.1.0-windows-x64.zip
            release/hosted/NodeRedMetadata-1.1.0-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 1
