# File: Validate the exact Node-RED dependency graph and native Linux/Windows quality gates.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run complete quality gate
        run: pnpm verify
      - name: Build installable package
        if: runner.os == 'Linux' && matrix.node == 24
        run: pnpm pack:artifact
      - name: Upload coverage and package evidence
        if: runner.os == 'Linux' && matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-red-resilient-metadata-evidence
          path: |
            artifacts/*.tgz
            coverage/
          if-no-files-found: error
          retention-days: 14
